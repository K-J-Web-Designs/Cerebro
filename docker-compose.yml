services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cerebro-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cerebro
      POSTGRES_PASSWORD: cerebro_dev_password
      POSTGRES_DB: cerebro
    volumes:
      - cerebro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerebro -d cerebro"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cerebro_pgdata:
